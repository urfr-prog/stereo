<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ADAM - Domino Matrix v3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #12131a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(5, 120px);
            gap: 14px;
            padding: 20px 0;
        }
        .domino {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }
        .domino svg {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        /* === COULEUR UNIQUE : Silver Ice === */
        :root {
            --ice: #7ec8e3;
            --ice50: rgba(126,200,227,0.5);
            --ice40: rgba(126,200,227,0.4);
            --ice30: rgba(126,200,227,0.3);
            --ice20: rgba(126,200,227,0.2);
            --ice12: rgba(126,200,227,0.12);
            --ice06: rgba(126,200,227,0.06);
            --ice03: rgba(126,200,227,0.03);
        }
        svg .sep { stroke: var(--ice30); stroke-width: 0.8; }
        svg .ic { stroke: var(--ice); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px var(--ice50)); }
        svg .pt { fill: var(--ice); filter: drop-shadow(0 0 4px var(--ice50)); }
        svg .ring { fill: none; stroke: var(--ice); stroke-width: 1.5; filter: drop-shadow(0 0 3px var(--ice40)); }

        /* ============================================
           STYLE A - Classic (comme flip 3D back)
           Fond pur, bordure ice, halo subtil
           ============================================ */
        .style-a {
            background: #12131a;
            border: 1px solid var(--ice50);
            box-shadow: 0 0 18px var(--ice12), inset 0 0 30px var(--ice03);
        }

        /* ============================================
           STYLE B - Deep Void
           Fond plus noir, bordure fine, halo fort au sol
           ============================================ */
        .style-b {
            background: #0a0a0f;
            border: 1px solid var(--ice30);
            box-shadow: 0 4px 25px var(--ice20), 0 0 8px var(--ice06);
        }

        /* ============================================
           STYLE C - Inner Glow
           Fond légèrement éclairé de l'intérieur
           ============================================ */
        .style-c {
            background: radial-gradient(ellipse at 50% 40%, rgba(126,200,227,0.06) 0%, #0e0f15 70%);
            border: 1px solid var(--ice40);
            box-shadow: 0 0 14px var(--ice06);
        }

        /* ============================================
           STYLE D - Frosted Glass
           Bordure plus épaisse, fond brumeux
           ============================================ */
        .style-d {
            background: linear-gradient(145deg, rgba(126,200,227,0.04) 0%, rgba(12,13,20,1) 50%, rgba(126,200,227,0.02) 100%);
            border: 1.5px solid var(--ice30);
            box-shadow: inset 0 1px 0 rgba(126,200,227,0.12), 0 0 12px var(--ice06);
        }

        /* ============================================
           STYLE E - Embossed
           Relief en creux, ombre intérieure forte
           ============================================ */
        .style-e {
            background: #0d0e14;
            border: 1px solid rgba(126,200,227,0.2);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), inset 0 -1px 4px rgba(126,200,227,0.08), 0 1px 2px rgba(126,200,227,0.06);
        }

        /* ============================================
           STYLE F - Double Border
           Double cadre, premier très fin externe
           ============================================ */
        .style-f {
            background: #10111a;
            border: 1px solid var(--ice40);
            outline: 1px solid rgba(126,200,227,0.12);
            outline-offset: 3px;
            box-shadow: 0 0 20px var(--ice06);
        }
        .style-f { border-radius: 16px; }

        /* ============================================
           STYLE G - Bottom Halo
           Halo concentré en bas comme une flamme froide
           ============================================ */
        .style-g {
            background: #12131a;
            border: 1px solid var(--ice30);
            box-shadow: 0 8px 30px rgba(126,200,227,0.18), 0 2px 10px rgba(126,200,227,0.08);
        }

        /* ============================================
           STYLE H - Gradient Border Feel
           Fond avec gradient subtil haut→bas
           ============================================ */
        .style-h {
            background: linear-gradient(180deg, rgba(126,200,227,0.05) 0%, #0a0a10 40%, #0a0a10 100%);
            border: 1px solid var(--ice40);
            box-shadow: 0 0 10px var(--ice06), inset 0 0 20px var(--ice03);
        }

        /* ============================================
           STYLE I - Gem Cut (facette brillante)
           Highlight diagonal + fond très sombre
           ============================================ */
        .style-i {
            background: linear-gradient(135deg, rgba(126,200,227,0.07) 0%, transparent 30%, transparent 70%, rgba(126,200,227,0.03) 100%);
            border: 1px solid var(--ice40);
            box-shadow: 0 0 15px var(--ice06);
        }
        .style-i::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 50%; bottom: 50%;
            background: linear-gradient(135deg, rgba(126,200,227,0.06) 0%, transparent 100%);
            border-radius: 16px 0 0 0;
            z-index: 1;
        }

        /* Icônes avec relief plus prononcé sur certains styles */
        .style-e svg .ic { filter: drop-shadow(0 0 3px var(--ice40)) drop-shadow(0 2px 1px rgba(0,0,0,0.5)); }
        .style-e svg .pt { filter: drop-shadow(0 0 3px var(--ice40)) drop-shadow(0 2px 1px rgba(0,0,0,0.5)); }

        /* Icônes plus lumineuses sur fond très sombre */
        .style-b svg .ic { filter: drop-shadow(0 0 6px var(--ice50)) drop-shadow(0 0 12px var(--ice20)); }
        .style-b svg .pt { filter: drop-shadow(0 0 6px var(--ice50)) drop-shadow(0 0 12px var(--ice20)); }
    </style>
</head>
<body>
