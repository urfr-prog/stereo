<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADAM·CUBE — V1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background-color: #0c0d14;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: rgba(180,180,190,0.7);
            font-family: monospace;
            font-size: 11px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
        }

        /* ========== CONTENEUR PRINCIPAL ========== */
        .game-container {
            position: relative;
            --cell: min(100px, 28vw);
            --half: calc(var(--cell) / 2);
            --gap: 8px;
            width: calc(3 * var(--cell) + 2 * var(--gap));
            height: calc(3 * var(--cell) + 2 * var(--gap));
        }

        .halo-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .halo-element {
            position: absolute;
            border-radius: 14px;
            pointer-events: none;
        }
        .halo-element.halo-silver   { box-shadow: 0 0 15px rgba(6,182,212,0.5), 0 0 25px rgba(6,182,212,0.3); }
        .halo-element.halo-gold     { box-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 35px rgba(255,215,0,0.3); }
        .halo-element.halo-emerald  { box-shadow: 0 0 25px rgba(52,211,153,0.7), 0 0 45px rgba(52,211,153,0.4); }
        .halo-element.halo-cosmic   { box-shadow: 0 0 30px rgba(131,56,236,0.6), 0 0 50px rgba(255,0,110,0.3); }
        .halo-element.halo-supernovae { box-shadow: 0 0 35px rgba(255,0,110,0.7), 0 0 55px rgba(255,215,0,0.5); }

        .grid-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        .grid-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* ========== DEMI-DOMINO (face visible) ========== */
        .face {
            position: absolute;
            background-color: #0e0f18;
            border: 1px solid rgba(126,200,227,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            z-index: 1;
            /* Perspective pour la rotation 3D au tap */
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
        }

        .face.ghost {
            opacity: 0.9;
            pointer-events: none;
            z-index: 0;
        }

        .face.empty { opacity: 0.3; }

        .face.top    { border-radius: 14px 14px 0 0; }
        .face.bottom { border-radius: 0 0 14px 14px; margin-top: -1px; }

        .face svg { width: 90%; height: 90%; }

        /* ========== ICÔNES SVG ========== */
        svg line.icon, svg path.icon, svg circle.icon, svg rect.icon {
            stroke: rgba(126,200,227,0.35);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        svg path.icon.filled { fill: rgba(126,200,227,0.35); stroke: none; }
        svg circle.point { fill: rgba(126,200,227,0.35); stroke: none; }

        /* ========== ÉTATS ========== */
        .face.white svg .icon { stroke: rgba(180,180,190,0.35); }
        .face.white svg .icon.filled { fill: rgba(180,180,190,0.35); }
        .face.white svg .point { fill: rgba(180,180,190,0.35); }

        .face.silver svg .icon { stroke: #22d3ee; filter: drop-shadow(0 0 2px rgba(34,211,238,0.4)); }
        .face.silver svg .icon.filled { fill: #22d3ee; filter: drop-shadow(0 0 2px rgba(34,211,238,0.4)); }
        .face.silver svg .point { fill: #22d3ee; filter: drop-shadow(0 0 2px rgba(34,211,238,0.4)); }
        .face.silver { box-shadow: inset 0 0 15px rgba(6,182,212,0.15); border-color: rgba(6,182,212,0.4); }

        .face.gold svg .icon { stroke: #ffd700; filter: drop-shadow(0 0 4px rgba(255,215,0,0.6)); }
        .face.gold svg .icon.filled { fill: #ffd700; filter: drop-shadow(0 0 4px rgba(255,215,0,0.6)); }
        .face.gold svg .point { fill: #ffd700; filter: drop-shadow(0 0 4px rgba(255,215,0,0.6)); }
        .face.gold { box-shadow: inset 0 0 20px rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.5); }

        .face.emerald svg .icon { stroke: #34d399; filter: drop-shadow(0 0 6px rgba(52,211,153,0.9)); }
        .face.emerald svg .icon.filled { fill: #34d399; filter: drop-shadow(0 0 6px rgba(52,211,153,0.9)); }
        .face.emerald svg .point { fill: #34d399; filter: drop-shadow(0 0 6px rgba(52,211,153,0.9)); }
        .face.emerald { box-shadow: inset 0 0 25px rgba(52,211,153,0.2); border-color: rgba(52,211,153,0.6); }

        .face.cosmic svg .icon { stroke: #c4b5fd; filter: drop-shadow(0 0 6px rgba(131,56,236,0.7)); }
        .face.cosmic svg .icon.filled { fill: #c4b5fd; filter: drop-shadow(0 0 6px rgba(131,56,236,0.7)); }
        .face.cosmic svg .point { fill: #c4b5fd; filter: drop-shadow(0 0 6px rgba(131,56,236,0.7)); }
        .face.cosmic { box-shadow: inset 0 0 25px rgba(131,56,236,0.2); border-color: rgba(131,56,236,0.6); }

        .face.supernovae svg .icon { stroke: #ff006e; filter: drop-shadow(0 0 8px rgba(255,0,110,0.9)) drop-shadow(0 0 15px rgba(255,215,0,0.5)); }
        .face.supernovae svg .icon.filled { fill: #ff006e; filter: drop-shadow(0 0 8px rgba(255,0,110,0.9)) drop-shadow(0 0 15px rgba(255,215,0,0.5)); }
        .face.supernovae svg .point { fill: #ff006e; filter: drop-shadow(0 0 8px rgba(255,0,110,0.9)) drop-shadow(0 0 15px rgba(255,215,0,0.5)); }
        .face.supernovae { box-shadow: inset 0 0 30px rgba(255,0,110,0.25); border-color: rgba(255,0,110,0.7); }

        /* Halos internes */
        .face.halo-silver    { box-shadow: inset 0 0 15px rgba(6,182,212,0.2); }
        .face.halo-gold      { box-shadow: inset 0 0 20px rgba(255,215,0,0.2); }
        .face.halo-emerald   { box-shadow: inset 0 0 25px rgba(52,211,153,0.25); }
        .face.halo-cosmic    { box-shadow: inset 0 0 25px rgba(131,56,236,0.25); }
        .face.halo-supernovae{ box-shadow: inset 0 0 30px rgba(255,0,110,0.3); }

        /* ========== ANIMATIONS ========== */
        @keyframes fusionDisappear {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes fusionReappear {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .fusion-disappear { animation: fusionDisappear 0.3s ease-out forwards; }
        .fusion-reappear  { animation: fusionReappear 0.3s ease-out forwards; }

        /* ========== INDICATEUR DE PAIRE ACTIVE ========== */
        .pair-indicator {
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 20;
            pointer-events: none;
        }
        .pair-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(126,200,227,0.2);
            transition: background 0.3s;
        }
        .pair-dot.active {
            background: rgba(126,200,227,0.7);
        }

        /* ========== ROTATION 3D SCENE ========== */
        .cube-scene {
            position: absolute;
            perspective: 400px;
            z-index: 1;
        }
        .cube-body {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .cube-face-front, .cube-face-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
        }
        .cube-face-front { transform: translateZ(1px); }
        .cube-face-back   { transform: rotateX(180deg) translateZ(1px); }

        .cube-face-front .face,
        .cube-face-back .face {
            position: relative;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="debug" id="debug">ADAM·CUBE V1</div>
    <div class="game-container">
        <div class="halo-layer" id="haloLayer"></div>
        <div class="grid-wrapper" id="wrapper">
            <div class="grid-container" id="grid"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIG
        // ============================================
        const COLS = 3;
        const ROWS = 3;
        const TOTAL_CELLS = COLS * ROWS;
        const PAIRS_PER_CUBE = 2; // Paire A (front) et Paire B (back)
        const TOTAL_FACES = TOTAL_CELLS * 2 * PAIRS_PER_CUBE; // 9 cubes × 2 faces × 2 paires = 36

        const STATE_ORDER = ['white', 'silver', 'gold', 'emerald', 'cosmic', 'supernovae'];

        const grid = document.getElementById('grid');
        const haloLayer = document.getElementById('haloLayer');
        const debug = document.getElementById('debug');

        let CELL_SIZE = 100, HALF_SIZE = 50, GAP = 8, CELL_TOTAL = 108;
        let GRID_WIDTH, GRID_HEIGHT;
        let isAnimating = false;

        function updateDimensions() {
            const vw28 = window.innerWidth * 0.28;
            CELL_SIZE = Math.min(100, vw28);
            HALF_SIZE = CELL_SIZE / 2;
            GAP = 8;
            CELL_TOTAL = CELL_SIZE + GAP;
            GRID_WIDTH = COLS * CELL_TOTAL;
            GRID_HEIGHT = ROWS * CELL_TOTAL;
        }

        function log(msg) { console.log(msg); debug.textContent = msg; }

        // ============================================
        // ICÔNES (repris d'ADAM V4)
        // ============================================
        const ICONS = {
            chevron:    { f1: 'M60 8L30 22.5L60 37', f2: 'M30 8L60 22.5L30 37', t: 'path' },
            circle:     { f1: '45,22.5,12', f2: '45,22.5,12', t: 'circle' },
            twoCircles: { f1: '30,22.5,8|60,22.5,8', f2: '30,22.5,8|60,22.5,8', t: 'circles' },
            line:       { f1: '45,8,45,37', f2: '45,8,45,37', t: 'line' },
            threeLines: { f1: '25,12,65,12|25,22.5,65,22.5|25,33,65,33', f2: '25,12,65,12|25,22.5,65,22.5|25,33,65,33', t: 'lines' },
            twoPoints:  { f1: '32,22.5,4|58,22.5,4', f2: '32,22.5,4|58,22.5,4', t: 'points' },
            square:     { f1: '33,10,25,25,3', f2: '33,10,25,25,3', t: 'rect' },
            wave:       { f1: 'M15 22.5Q35 8 45 22.5Q55 37 75 22.5', f2: 'M15 22.5Q35 37 45 22.5Q55 8 75 22.5', t: 'path' }
        };
        const ICON_KEYS = Object.keys(ICONS);

        function renderIcon(iconKey, isF2) {
            if (!iconKey) return '';
            const d = ICONS[iconKey];
            if (!d) return '';
            const data = isF2 ? d.f2 : d.f1;

            if (d.t === 'path')    return `<path class="icon" d="${data}"/>`;
            if (d.t === 'circle')  { const [cx,cy,r] = data.split(','); return `<circle class="icon" cx="${cx}" cy="${cy}" r="${r}"/>`; }
            if (d.t === 'line')    { const [x1,y1,x2,y2] = data.split(','); return `<line class="icon" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
            if (d.t === 'rect')    { const [x,y,w,h,rx] = data.split(','); return `<rect class="icon" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`; }
            if (d.t === 'lines')   return data.split('|').map(p => { const [x1,y1,x2,y2] = p.split(','); return `<line class="icon" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }).join('');
            if (d.t === 'circles') return data.split('|').map(p => { const [cx,cy,r] = p.split(','); return `<circle class="icon" cx="${cx}" cy="${cy}" r="${r}"/>`; }).join('');
            if (d.t === 'points')  return data.split('|').map(p => { const [cx,cy,r] = p.split(','); return `<circle class="point" cx="${cx}" cy="${cy}" r="${r}"/>`; }).join('');
            return '';
        }

        // ============================================
        // DONNÉES
        // Chaque cube a 2 paires. Chaque paire = { topIcon, bottomIcon, topState, bottomState }
        // activePair = 0 ou 1
        // Les "faces" pour la mécanique ADAM = paire active seulement
        // ============================================
        let cubes = []; // 9 cubes

        function seededRandom(seed) {
            let s = seed;
            return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
        }

        function initCubes() {
            cubes = [];
            const rng = seededRandom(42);

            for (let c = 0; c < TOTAL_CELLS; c++) {
                const pairs = [];
                for (let p = 0; p < PAIRS_PER_CUBE; p++) {
                    pairs.push({
                        topIcon: ICON_KEYS[Math.floor(rng() * ICON_KEYS.length)],
                        bottomIcon: ICON_KEYS[Math.floor(rng() * ICON_KEYS.length)],
                        topState: 'white',
                        bottomState: 'white'
                    });
                }
                cubes.push({
                    pairs,
                    activePair: 0,
                    cellIndex: c  // position dans la grille (slot)
                });
            }
        }

        // ============================================
        // HELPERS
        // ============================================
        function getCellPosition(cellIndex) {
            const col = cellIndex % COLS;
            const row = Math.floor(cellIndex / COLS);
            return { col, row, x: col * CELL_TOTAL, y: row * CELL_TOTAL };
        }

        function getCubeAtCell(cellIndex) {
            return cubes.find(c => c.cellIndex === cellIndex);
        }

        function getColumnCubes(col) {
            const result = [];
            for (let row = 0; row < ROWS; row++) {
                const cube = getCubeAtCell(row * COLS + col);
                if (cube) result.push(cube);
            }
            return result;
        }

        // Étage = demi-rangée. 0=top de row0, 1=bottom de row0, 2=top de row1...
        function getEtageCubes(etage) {
            const row = Math.floor(etage / 2);
            const result = [];
            for (let col = 0; col < COLS; col++) {
                const cube = getCubeAtCell(row * COLS + col);
                if (cube) result.push(cube);
            }
            return result;
        }

        // Active pair accessors
        function getActiveTop(cube) {
            const p = cube.pairs[cube.activePair];
            return { icon: p.topIcon, state: p.topState };
        }
        function getActiveBottom(cube) {
            const p = cube.pairs[cube.activePair];
            return { icon: p.bottomIcon, state: p.bottomState };
        }
        function setActiveTopState(cube, state) { cube.pairs[cube.activePair].topState = state; }
        function setActiveBottomState(cube, state) { cube.pairs[cube.activePair].bottomState = state; }
        function setActiveTopIcon(cube, icon) { cube.pairs[cube.activePair].topIcon = icon; }
        function setActiveBottomIcon(cube, icon) { cube.pairs[cube.activePair].bottomIcon = icon; }

        // ============================================
        // RENDU
        // ============================================
        let cubeElements = []; // { sceneEl, bodyEl, frontTop, frontBottom, backTop, backBottom, indicatorDots }
        let ghostElements = [];

        function buildFaceHTML(iconKey, isBottom, stateClass) {
            const svg = renderIcon(iconKey, isBottom);
            return `<svg viewBox="0 0 90 45">${svg}</svg>`;
        }

        function createCubeElement(cube) {
            const pos = getCellPosition(cube.cellIndex);
            const pA = cube.pairs[0];
            const pB = cube.pairs[1];

            // Scene (perspective container)
            const scene = document.createElement('div');
            scene.className = 'cube-scene';
            scene.style.width = CELL_SIZE + 'px';
            scene.style.height = CELL_SIZE + 'px';
            scene.style.left = pos.x + 'px';
            scene.style.top = pos.y + 'px';

            // Body (rotates)
            const body = document.createElement('div');
            body.className = 'cube-body';
            scene.appendChild(body);

            // Front = paire A
            const frontDiv = document.createElement('div');
            frontDiv.className = 'cube-face-front';
            const fTopA = document.createElement('div');
            fTopA.className = `face top ${pA.topState}`;
            fTopA.style.height = HALF_SIZE + 'px';
            fTopA.innerHTML = buildFaceHTML(pA.topIcon, false, pA.topState);
            const fBotA = document.createElement('div');
            fBotA.className = `face bottom ${pA.bottomState}`;
            fBotA.style.height = HALF_SIZE + 'px';
            fBotA.innerHTML = buildFaceHTML(pA.bottomIcon, true, pA.bottomState);
            frontDiv.appendChild(fTopA);
            frontDiv.appendChild(fBotA);
            body.appendChild(frontDiv);

            // Back = paire B (rotateX 180)
            const backDiv = document.createElement('div');
            backDiv.className = 'cube-face-back';
            const fTopB = document.createElement('div');
            fTopB.className = `face top ${pB.topState}`;
            fTopB.style.height = HALF_SIZE + 'px';
            fTopB.innerHTML = buildFaceHTML(pB.topIcon, false, pB.topState);
            const fBotB = document.createElement('div');
            fBotB.className = `face bottom ${pB.bottomState}`;
            fBotB.style.height = HALF_SIZE + 'px';
            fBotB.innerHTML = buildFaceHTML(pB.bottomIcon, true, pB.bottomState);
            backDiv.appendChild(fTopB);
            backDiv.appendChild(fBotB);
            body.appendChild(backDiv);

            // Indicateur de paire
            const indicator = document.createElement('div');
            indicator.className = 'pair-indicator';
            const dot0 = document.createElement('div');
            dot0.className = 'pair-dot active';
            const dot1 = document.createElement('div');
            dot1.className = 'pair-dot';
            indicator.appendChild(dot0);
            indicator.appendChild(dot1);
            scene.appendChild(indicator);

            grid.appendChild(scene);

            return {
                sceneEl: scene, bodyEl: body,
                frontTop: fTopA, frontBottom: fBotA,
                backTop: fTopB, backBottom: fBotB,
                dots: [dot0, dot1]
            };
        }

        function initialRender() {
            grid.innerHTML = '';
            cubeElements = [];
            for (const cube of cubes) {
                cubeElements.push(createCubeElement(cube));
            }
            updateHalos();
        }

        function getCubeElementIdx(cube) {
            return cubes.indexOf(cube);
        }

        function updateCubeVisual(cube) {
            const idx = getCubeElementIdx(cube);
            if (idx < 0) return;
            const el = cubeElements[idx];
            const pA = cube.pairs[0];
            const pB = cube.pairs[1];

            // Front faces (paire A)
            el.frontTop.className = `face top ${pA.topState}${!pA.topIcon ? ' empty' : ''}`;
            el.frontTop.innerHTML = buildFaceHTML(pA.topIcon, false, pA.topState);
            el.frontTop.style.height = HALF_SIZE + 'px';
            el.frontBottom.className = `face bottom ${pA.bottomState}${!pA.bottomIcon ? ' empty' : ''}`;
            el.frontBottom.innerHTML = buildFaceHTML(pA.bottomIcon, true, pA.bottomState);
            el.frontBottom.style.height = HALF_SIZE + 'px';

            // Back faces (paire B)
            el.backTop.className = `face top ${pB.topState}${!pB.topIcon ? ' empty' : ''}`;
            el.backTop.innerHTML = buildFaceHTML(pB.topIcon, false, pB.topState);
            el.backTop.style.height = HALF_SIZE + 'px';
            el.backBottom.className = `face bottom ${pB.bottomState}${!pB.bottomIcon ? ' empty' : ''}`;
            el.backBottom.innerHTML = buildFaceHTML(pB.bottomIcon, true, pB.bottomState);
            el.backBottom.style.height = HALF_SIZE + 'px';

            // Rotation du body selon paire active
            el.bodyEl.style.transform = cube.activePair === 0 ? 'rotateX(0deg)' : 'rotateX(180deg)';

            // Dots
            el.dots[0].className = `pair-dot${cube.activePair === 0 ? ' active' : ''}`;
            el.dots[1].className = `pair-dot${cube.activePair === 1 ? ' active' : ''}`;
        }

        function updateCubePosition(cube, animate = true) {
            const idx = getCubeElementIdx(cube);
            if (idx < 0) return;
            const el = cubeElements[idx];
            const pos = getCellPosition(cube.cellIndex);

            el.sceneEl.style.transition = animate ? 'left 0.15s ease-out, top 0.15s ease-out' : 'none';
            el.sceneEl.style.left = pos.x + 'px';
            el.sceneEl.style.top = pos.y + 'px';
        }

        function updateAll(animate = true) {
            cubes.forEach(c => { updateCubePosition(c, animate); updateCubeVisual(c); });
            updateHalos();
        }

        // ============================================
        // TAP → ROTATION 3D (switch de paire)
        // ============================================
        function flipCube(cube) {
            if (isAnimating) return;
            cube.activePair = (cube.activePair + 1) % PAIRS_PER_CUBE;
            const idx = getCubeElementIdx(cube);
            const el = cubeElements[idx];

            el.bodyEl.style.transform = cube.activePair === 0 ? 'rotateX(0deg)' : 'rotateX(180deg)';
            el.dots[0].className = `pair-dot${cube.activePair === 0 ? ' active' : ''}`;
            el.dots[1].className = `pair-dot${cube.activePair === 1 ? ' active' : ''}`;

            log(`Flip cube ${cube.cellIndex} → paire ${cube.activePair === 0 ? 'A' : 'B'}`);
            updateHalos();
            setTimeout(checkFusions, 550);
        }

        // ============================================
        // HALOS (domino complet de même état, paire active)
        // ============================================
        function updateHalos() {
            haloLayer.innerHTML = '';

            for (const cube of cubes) {
                const idx = getCubeElementIdx(cube);
                const el = cubeElements[idx];
                const active = cube.pairs[cube.activePair];

                // Reset halos on faces
                [el.frontTop, el.frontBottom, el.backTop, el.backBottom].forEach(f => {
                    f.classList.remove('halo-silver','halo-gold','halo-emerald','halo-cosmic','halo-supernovae');
                });

                if (active.topState === active.bottomState &&
                    active.topState !== 'white' &&
                    active.topIcon && active.bottomIcon) {

                    const haloClass = 'halo-' + active.topState;
                    const topEl = cube.activePair === 0 ? el.frontTop : el.backTop;
                    const botEl = cube.activePair === 0 ? el.frontBottom : el.backBottom;
                    topEl.classList.add(haloClass);
                    botEl.classList.add(haloClass);

                    const pos = getCellPosition(cube.cellIndex);
                    const haloEl = document.createElement('div');
                    haloEl.className = 'halo-element ' + haloClass;
                    haloEl.style.left = pos.x + 'px';
                    haloEl.style.top = pos.y + 'px';
                    haloEl.style.width = CELL_SIZE + 'px';
                    haloEl.style.height = CELL_SIZE + 'px';
                    haloLayer.appendChild(haloEl);
                }
            }
        }

        // ============================================
        // GRAVITÉ
        // ============================================
        function applyGravityWithCallback(callback) {
            let anyMoved = false;

            for (let col = 0; col < COLS; col++) {
                // Cubes dans cette colonne, triés de bas en haut
                const colCubes = [];
                for (let row = ROWS - 1; row >= 0; row--) {
                    const c = getCubeAtCell(row * COLS + col);
                    if (c) colCubes.push(c);
                }

                // Vérifier si un cube a ses deux faces actives vides → il "tombe"
                // La gravité ici = les cubes avec contenu actif vide remontent
                for (let i = 0; i < colCubes.length; i++) {
                    const c = colCubes[i];
                    const active = c.pairs[c.activePair];
                    if (!active.topIcon && !active.bottomIcon) {
                        // Cube entièrement vide sur sa paire active, chercher un plein au-dessus
                        for (let j = i + 1; j < colCubes.length; j++) {
                            const above = colCubes[j];
                            const aboveActive = above.pairs[above.activePair];
                            if (aboveActive.topIcon || aboveActive.bottomIcon) {
                                // Swap positions
                                const tmpCell = c.cellIndex;
                                c.cellIndex = above.cellIndex;
                                above.cellIndex = tmpCell;
                                anyMoved = true;
                                break;
                            }
                        }
                    }
                }
            }

            if (anyMoved) {
                isAnimating = true;
                updateAll(true);
                setTimeout(() => { isAnimating = false; applyGravityWithCallback(callback); }, 200);
            } else {
                if (callback) callback();
            }
        }

        // ============================================
        // FUSION — corridors entre row N (bottom actif) et row N+1 (top actif)
        // ============================================
        function checkFusions() {
            if (isAnimating) return;

            for (let row = 0; row < ROWS - 1; row++) {
                for (let col = 0; col < COLS; col++) {
                    const upperCube = getCubeAtCell(row * COLS + col);
                    const lowerCube = getCubeAtCell((row + 1) * COLS + col);
                    if (!upperCube || !lowerCube) continue;

                    const upperBottom = getActiveBottom(upperCube);
                    const lowerTop = getActiveTop(lowerCube);

                    if (!upperBottom.icon || !lowerTop.icon) continue;
                    if (upperBottom.icon !== lowerTop.icon) continue;
                    if (upperBottom.state !== lowerTop.state) continue;

                    // Fusion !
                    performFusion(upperCube, lowerCube, col);
                    return;
                }
            }
            log('Prêt');
        }

        function performFusion(upperCube, lowerCube, col) {
            isAnimating = true;
            const fusionIcon = getActiveBottom(upperCube).icon;
            const fusionState = getActiveBottom(upperCube).state;

            const nextStateIdx = Math.min(STATE_ORDER.indexOf(fusionState) + 1, STATE_ORDER.length - 1);
            const nextState = STATE_ORDER[nextStateIdx];

            log(`FUSION: ${fusionIcon} (${fusionState} → ${nextState})`);

            // Disparition des faces qui fusionnent
            const uIdx = getCubeElementIdx(upperCube);
            const lIdx = getCubeElementIdx(lowerCube);
            const uBotEl = upperCube.activePair === 0 ? cubeElements[uIdx].frontBottom : cubeElements[uIdx].backBottom;
            const lTopEl = lowerCube.activePair === 0 ? cubeElements[lIdx].frontTop : cubeElements[lIdx].backTop;

            uBotEl.classList.add('fusion-disappear');
            lTopEl.classList.add('fusion-disappear');

            setTimeout(() => {
                // Annuler les faces fusionnées
                setActiveBottomIcon(upperCube, null);
                setActiveBottomState(upperCube, 'white');
                setActiveTopIcon(lowerCube, null);
                setActiveTopState(lowerCube, 'white');

                // Partenaires montent d'état
                setActiveTopState(upperCube, nextState);
                setActiveBottomState(lowerCube, nextState);

                updateCubeVisual(upperCube);
                updateCubeVisual(lowerCube);

                isAnimating = false;

                setTimeout(() => {
                    applyGravityWithCallback(() => {
                        respawnTwin(col, fusionIcon);
                    });
                }, 100);
            }, 300);
        }

        function respawnTwin(col, icon) {
            // Trouver un cube dans la colonne dont les deux faces actives sont vides
            for (let row = 0; row < ROWS; row++) {
                const cube = getCubeAtCell(row * COLS + col);
                if (!cube) continue;
                const active = cube.pairs[cube.activePair];
                if (!active.topIcon && !active.bottomIcon) {
                    isAnimating = true;
                    active.topIcon = icon;
                    active.bottomIcon = icon;
                    active.topState = 'white';
                    active.bottomState = 'white';
                    updateCubeVisual(cube);

                    const idx = getCubeElementIdx(cube);
                    const topEl = cube.activePair === 0 ? cubeElements[idx].frontTop : cubeElements[idx].backTop;
                    const botEl = cube.activePair === 0 ? cubeElements[idx].frontBottom : cubeElements[idx].backBottom;
                    topEl.classList.add('fusion-reappear');
                    botEl.classList.add('fusion-reappear');

                    setTimeout(() => {
                        topEl.classList.remove('fusion-reappear');
                        botEl.classList.remove('fusion-reappear');
                        isAnimating = false;
                        updateHalos();
                        checkFusions();
                    }, 350);
                    return;
                }
            }
            // Pas de cube vide trouvé
            isAnimating = false;
            updateHalos();
            checkFusions();
        }

        // ============================================
        // DRAG — colonnes verticales et étages horizontaux
        // ============================================
        let isDragging = false;
        let dragAxis = null;
        let dragCol = -1, dragEtage = -1;
        let dragStartX = 0, dragStartY = 0, dragOffset = 0;
        let draggedCubes = [];
        let initialPositions = [];

        function clearGhosts() {
            ghostElements.forEach(g => g.el.remove());
            ghostElements = [];
        }

        // --- Vertical drag (colonne entière) ---
        function startVerticalDrag(col) {
            if (isAnimating) return;
            dragAxis = 'vertical';
            dragCol = col;
            haloLayer.innerHTML = '';

            draggedCubes = [];
            initialPositions = [];

            for (let row = 0; row < ROWS; row++) {
                const cube = getCubeAtCell(row * COLS + col);
                if (!cube) continue;
                const idx = getCubeElementIdx(cube);
                const pos = getCellPosition(cube.cellIndex);
                draggedCubes.push(cube);
                initialPositions.push({ cube, idx, baseY: pos.y, row });
            }

            // Ghosts haut et bas
            for (const item of initialPositions) {
                const el = cubeElements[item.idx].sceneEl;
                // Clone ghost top
                const ghostTop = el.cloneNode(true);
                ghostTop.style.opacity = '0.5';
                ghostTop.style.pointerEvents = 'none';
                ghostTop.style.top = (item.baseY - GRID_HEIGHT) + 'px';
                grid.appendChild(ghostTop);
                ghostElements.push({ el: ghostTop, baseY: item.baseY - GRID_HEIGHT });

                const ghostBot = el.cloneNode(true);
                ghostBot.style.opacity = '0.5';
                ghostBot.style.pointerEvents = 'none';
                ghostBot.style.top = (item.baseY + GRID_HEIGHT) + 'px';
                grid.appendChild(ghostBot);
                ghostElements.push({ el: ghostBot, baseY: item.baseY + GRID_HEIGHT });
            }
        }

        function startHorizontalDrag(etage) {
            if (isAnimating) return;
            dragAxis = 'horizontal';
            dragEtage = etage;
            haloLayer.innerHTML = '';

            draggedCubes = [];
            initialPositions = [];

            const row = Math.floor(etage / 2);
            for (let col = 0; col < COLS; col++) {
                const cube = getCubeAtCell(row * COLS + col);
                if (!cube) continue;
                const idx = getCubeElementIdx(cube);
                const pos = getCellPosition(cube.cellIndex);
                draggedCubes.push(cube);
                initialPositions.push({ cube, idx, baseX: pos.x, col });
            }

            for (const item of initialPositions) {
                const el = cubeElements[item.idx].sceneEl;
                const ghostL = el.cloneNode(true);
                ghostL.style.opacity = '0.5';
                ghostL.style.pointerEvents = 'none';
                ghostL.style.left = (item.baseX - GRID_WIDTH) + 'px';
                grid.appendChild(ghostL);
                ghostElements.push({ el: ghostL, baseX: item.baseX - GRID_WIDTH });

                const ghostR = el.cloneNode(true);
                ghostR.style.opacity = '0.5';
                ghostR.style.pointerEvents = 'none';
                ghostR.style.left = (item.baseX + GRID_WIDTH) + 'px';
                grid.appendChild(ghostR);
                ghostElements.push({ el: ghostR, baseX: item.baseX + GRID_WIDTH });
            }
        }

        function moveDrag(e) {
            if (!isDragging || !dragAxis) return;

            if (dragAxis === 'vertical') {
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                dragOffset = clientY - dragStartY;

                for (const item of initialPositions) {
                    cubeElements[item.idx].sceneEl.style.transition = 'none';
                    cubeElements[item.idx].sceneEl.style.top = (item.baseY + dragOffset) + 'px';
                }
                for (const ghost of ghostElements) {
                    ghost.el.style.transition = 'none';
                    ghost.el.style.top = (ghost.baseY + dragOffset) + 'px';
                }
            } else {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                dragOffset = clientX - dragStartX;

                for (const item of initialPositions) {
                    cubeElements[item.idx].sceneEl.style.transition = 'none';
                    cubeElements[item.idx].sceneEl.style.left = (item.baseX + dragOffset) + 'px';
                }
                for (const ghost of ghostElements) {
                    ghost.el.style.transition = 'none';
                    ghost.el.style.left = (ghost.baseX + dragOffset) + 'px';
                }
            }
        }

        function endDrag() {
            if (!isDragging) return;

            const steps = Math.round(dragOffset / CELL_TOTAL);

            if (dragAxis === 'vertical') {
                // Appliquer le slide vertical (wrap-around)
                const col = dragCol;
                const s = ((steps % ROWS) + ROWS) % ROWS;
                if (s !== 0) {
                    // Calculer nouvelles positions
                    const moves = [];
                    for (const item of initialPositions) {
                        const newRow = ((item.row + steps) % ROWS + ROWS) % ROWS;
                        moves.push({ cube: item.cube, newCell: newRow * COLS + col });
                    }
                    moves.forEach(m => m.cube.cellIndex = m.newCell);
                }
                // Snap animation
                for (const item of initialPositions) {
                    const pos = getCellPosition(item.cube.cellIndex);
                    cubeElements[item.idx].sceneEl.style.transition = 'top 0.15s ease-out';
                    cubeElements[item.idx].sceneEl.style.top = pos.y + 'px';
                }
            } else {
                const row = Math.floor(dragEtage / 2);
                const s = ((steps % COLS) + COLS) % COLS;
                if (s !== 0) {
                    const moves = [];
                    for (const item of initialPositions) {
                        const newCol = ((item.col + steps) % COLS + COLS) % COLS;
                        moves.push({ cube: item.cube, newCell: row * COLS + newCol });
                    }
                    moves.forEach(m => m.cube.cellIndex = m.newCell);
                }
                for (const item of initialPositions) {
                    const pos = getCellPosition(item.cube.cellIndex);
                    cubeElements[item.idx].sceneEl.style.transition = 'left 0.15s ease-out';
                    cubeElements[item.idx].sceneEl.style.left = pos.x + 'px';
                }
            }

            setTimeout(() => {
                clearGhosts();
                updateAll(false);
                if (Math.round(dragOffset / CELL_TOTAL) !== 0) {
                    checkFusions();
                } else {
                    log('Prêt');
                }
            }, 200);

            isDragging = false;
            dragAxis = null;
            draggedCubes = [];
            initialPositions = [];
        }

        // ============================================
        // EVENT LISTENERS
        // ============================================
        let clickedCube = null;
        let clickStartTime = 0;
        let startCol = -1, startRow = -1, startEtage = -1;

        grid.addEventListener('mousedown', handleStart);
        grid.addEventListener('touchstart', handleStart, { passive: false });
        document.addEventListener('mousemove', handleMove);
        document.addEventListener('touchmove', handleMove, { passive: false });
        document.addEventListener('mouseup', handleEnd);
        document.addEventListener('touchend', handleEnd);

        function handleStart(e) {
            if (isAnimating) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            // Trouver quel cube est cliqué
            const sceneEl = e.target.closest('.cube-scene');
            if (!sceneEl) return;
            e.preventDefault();

            const idx = cubeElements.findIndex(ce => ce.sceneEl === sceneEl);
            if (idx < 0) return;

            clickedCube = cubes[idx];
            clickStartTime = Date.now();

            const pos = getCellPosition(clickedCube.cellIndex);
            startCol = pos.col;
            startRow = pos.row;

            // Déterminer si on est sur le top ou bottom du domino visible
            const rect = sceneEl.getBoundingClientRect();
            const relY = clientY - rect.top;
            const isBottom = relY > rect.height / 2;
            startEtage = startRow * 2 + (isBottom ? 1 : 0);

            isDragging = true;
            dragAxis = null;
            dragStartX = clientX;
            dragStartY = clientY;
            dragOffset = 0;
        }

        function handleMove(e) {
            if (!isDragging || isAnimating) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - dragStartX;
            const dy = clientY - dragStartY;

            if (dragAxis === null) {
                if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                    if (Math.abs(dx) > Math.abs(dy)) {
                        startHorizontalDrag(startEtage);
                    } else {
                        startVerticalDrag(startCol);
                    }
                }
            }

            if (dragAxis) moveDrag(e);
        }

        function handleEnd(e) {
            if (!isDragging) return;

            const elapsed = Date.now() - clickStartTime;

            // Tap = flip
            if (dragAxis === null && Math.abs(dragOffset) < 8 && elapsed < 300 && clickedCube) {
                flipCube(clickedCube);
                isDragging = false;
                clickedCube = null;
                return;
            }

            endDrag();
            clickedCube = null;
        }

        // ============================================
        // INIT
        // ============================================
        function init() {
            updateDimensions();
            initCubes();
            initialRender();
            log('ADAM·CUBE V1 — Tap pour flipper, Swipe pour glisser');
            setTimeout(checkFusions, 100);
        }

        if (document.readyState === 'complete') init();
        else window.addEventListener('load', init);

        window.addEventListener('resize', () => { updateDimensions(); updateAll(false); });
    </script>
</body>
