<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ADAM - Domino Matrix v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #12131a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(5, 120px);
            gap: 14px;
            padding: 20px 0;
        }
        .domino {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }
        .domino svg {
            width: 100%;
            height: 100%;
        }

        /* ============================================
           PALETTE PRÉCIEUSE - 6 ambiances
           ============================================ */

        /* 1 - Silver Ice (comme le flip 3D back) */
        .silver {
            border: 1px solid rgba(126,200,227,0.5);
            box-shadow: 0 0 18px rgba(126,200,227,0.12), inset 0 0 30px rgba(126,200,227,0.03);
        }
        .silver .sep { stroke: rgba(126,200,227,0.3); stroke-width: 0.8; }
        .silver .ic { stroke: #7ec8e3; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px rgba(126,200,227,0.5)); }
        .silver .pt { fill: #7ec8e3; filter: drop-shadow(0 0 4px rgba(126,200,227,0.5)); }
        .silver .ring { fill: none; stroke: #7ec8e3; stroke-width: 1.5; filter: drop-shadow(0 0 3px rgba(126,200,227,0.4)); }

        /* 2 - Rose Quartz */
        .rose {
            border: 1px solid rgba(220,160,180,0.45);
            box-shadow: 0 0 18px rgba(220,160,180,0.1), inset 0 0 30px rgba(220,160,180,0.03);
        }
        .rose .sep { stroke: rgba(220,160,180,0.25); stroke-width: 0.8; }
        .rose .ic { stroke: rgba(220,170,185,0.75); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px rgba(220,160,180,0.4)); }
        .rose .pt { fill: rgba(220,170,185,0.75); filter: drop-shadow(0 0 4px rgba(220,160,180,0.4)); }
        .rose .ring { fill: none; stroke: rgba(220,170,185,0.65); stroke-width: 1.5; filter: drop-shadow(0 0 3px rgba(220,160,180,0.35)); }

        /* 3 - Amethyst */
        .amethyst {
            border: 1px solid rgba(170,150,220,0.45);
            box-shadow: 0 0 18px rgba(170,150,220,0.1), inset 0 0 30px rgba(170,150,220,0.03);
        }
        .amethyst .sep { stroke: rgba(170,150,220,0.25); stroke-width: 0.8; }
        .amethyst .ic { stroke: rgba(180,160,225,0.75); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px rgba(170,150,220,0.45)); }
        .amethyst .pt { fill: rgba(180,160,225,0.75); filter: drop-shadow(0 0 4px rgba(170,150,220,0.45)); }
        .amethyst .ring { fill: none; stroke: rgba(180,160,225,0.65); stroke-width: 1.5; filter: drop-shadow(0 0 3px rgba(170,150,220,0.35)); }

        /* 4 - Jade */
        .jade {
            border: 1px solid rgba(130,200,170,0.45);
            box-shadow: 0 0 18px rgba(130,200,170,0.1), inset 0 0 30px rgba(130,200,170,0.03);
        }
        .jade .sep { stroke: rgba(130,200,170,0.25); stroke-width: 0.8; }
        .jade .ic { stroke: rgba(140,210,180,0.7); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px rgba(130,200,170,0.45)); }
        .jade .pt { fill: rgba(140,210,180,0.7); filter: drop-shadow(0 0 4px rgba(130,200,170,0.45)); }
        .jade .ring { fill: none; stroke: rgba(140,210,180,0.6); stroke-width: 1.5; filter: drop-shadow(0 0 3px rgba(130,200,170,0.35)); }

        /* 5 - Gold Pale */
        .gold {
            border: 1px solid rgba(220,200,140,0.4);
            box-shadow: 0 0 18px rgba(220,200,140,0.1), inset 0 0 30px rgba(220,200,140,0.03);
        }
        .gold .sep { stroke: rgba(220,200,140,0.25); stroke-width: 0.8; }
        .gold .ic { stroke: rgba(225,205,150,0.7); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 4px rgba(220,200,140,0.4)); }
        .gold .pt { fill: rgba(225,205,150,0.7); filter: drop-shadow(0 0 4px rgba(220,200,140,0.4)); }
        .gold .ring { fill: none; stroke: rgba(225,205,150,0.6); stroke-width: 1.5; filter: drop-shadow(0 0 3px rgba(220,200,140,0.35)); }

        /* 6 - Pearl (blanc nacré) */
        .pearl {
            border: 1px solid rgba(210,215,225,0.35);
            box-shadow: 0 0 18px rgba(210,215,225,0.08), inset 0 0 30px rgba(210,215,225,0.03);
        }
        .pearl .sep { stroke: rgba(210,215,225,0.2); stroke-width: 0.8; }
        .pearl .ic { stroke: rgba(215,220,230,0.55); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 3px rgba(210,215,225,0.3)); }
        .pearl .pt { fill: rgba(215,220,230,0.55); filter: drop-shadow(0 0 3px rgba(210,215,225,0.3)); }
        .pearl .ring { fill: none; stroke: rgba(215,220,230,0.45); stroke-width: 1.5; filter: drop-shadow(0 0 2px rgba(210,215,225,0.25)); }
    </style>
</head>
<body>

<div class="grid">

    <!-- R1C1 : SILVER - Lune croissant / 1 point -->
    <div class="domino silver">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>
            <path class="ic" d="M 50 12 A 16 16 0 1 0 50 38 A 11 11 0 1 1 50 12"/>
            <circle class="pt" cx="45" cy="67" r="3.5"/>

    <!-- R2C2 : GOLD - Soleil rayons / 4 points -->

            <line class="ic" x1="54" y1="16" x2="57" y2="13"/>

            <circle class="pt" cx="57" cy="77" r="3.2"/>
        </svg>
    </div>

    <!-- R2C3 : PEARL - Goutte / 1 anneau -->
    <div class="domino pearl">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>
            <path class="ic" d="M 45 10 Q 30 28 30 32 A 15 15 0 0 0 60 32 Q 60 28 45 10"/>
            <circle class="ring" cx="45" cy="67" r="6"/>
        </svg>
    </div>

    <!-- R3C1 : SILVER - Vagues superposées / 2 points -->
    <div class="domino silver">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>

    <!-- R3C2 : AMETHYST - Sablier / 3 anneaux -->
    <div class="domino amethyst">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>

            <circle class="ring" cx="45" cy="57" r="4.5"/>

            <circle class="ring" cx="57" cy="75" r="4.5"/>
        </svg>
    </div>

    <!-- R3C3 : ROSE - Papillon / 1 point -->
    <div class="domino rose">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>
            <path class="ic" d="M 45 18 Q 28 10 22 22 Q 18 34 45 32"/>
            <path class="ic" d="M 45 18 Q 62 10 68 22 Q 72 34 45 32"/>

            <circle class="pt" cx="45" cy="67" r="3.5"/>
        </svg>
    </div>

    <!-- R4C1 : GOLD - Couronne / 2 points diag -->
    <div class="domino gold">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>
            <path class="ic" d="M 22 36 L 22 14 L 34 24 L 45 10 L 56 24 L 68 14 L 68 36"/>
            <line class="ic" x1="22" y1="36" x2="68" y2="36"/>
            <circle class="pt" cx="36" cy="60" r="3.5"/>
            <circle class="pt" cx="54" cy="74" r="3.5"/>
        </svg>
    </div>

    <!-- R4C2 : JADE - Yin-yang simplifié / 3 points -->
    <div class="domino jade">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>
            <circle class="ring" cx="45" cy="25" r="14"/>
            <path class="ic" d="M 45 11 A 7 7 0 0 1 45 25 A 7 7 0 0 0 45 39"/>
            <circle class="pt" cx="45" cy="18" r="2"/>
            <circle class="ring" cx="45" cy="32" r="2"/>
            <circle class="pt" cx="30" cy="67" r="3.2"/>
            <circle class="pt" cx="45" cy="67" r="3.2"/>
            <circle class="pt" cx="60" cy="67" r="3.2"/>

    </div>

    <!-- R4C3 : SILVER - Étoile filante / 2 anneaux -->
    <div class="domino silver">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>

            <circle class="ring" cx="55" cy="67" r="5"/>

    </div>

    <!-- R5C1 : AMETHYST - Cristal / 4 points -->
    <div class="domino amethyst">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>

            <circle class="pt" cx="33" cy="57" r="3"/>
            <circle class="pt" cx="57" cy="57" r="3"/>
            <circle class="pt" cx="33" cy="77" r="3"/>
            <circle class="pt" cx="57" cy="77" r="3"/>
        </svg>
    </div>

    <!-- R5C2 : ROSE - Coquillage / 1 anneau -->
    <div class="domino rose">
        <svg viewBox="0 0 90 90">
            <line class="sep" x1="0" y1="45" x2="90" y2="45"/>

    <!-- R5C3 : GOLD - Plume / 2 points -->
    <div class="domino gold">
        <svg viewBox="0 0 90 90">

</div>
